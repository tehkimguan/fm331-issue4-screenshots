name: import screenshots

on:
  push:
    paths:
      - ".github/workflows/decode-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and commit PNG pairs
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/shots.zip "https://litter.catbox.moe/x0l8gl.zip"
          unzip -j -o /tmp/shots.zip -d /tmp/shots
          ls -lh /tmp/shots
          cp /tmp/shots/*.png .
          git config user.name "KG"
          git config user.email "kimguan.teh@outlook.com"
          git add *.png
          if git diff --staged --quiet; then
            echo "no png changes"
          else
            git commit -m "Add FM-331 published vs staging screenshot pairs"
            git push
          fi
